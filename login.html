<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | BRONE</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 25px;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 50px;
}

.login-box {
    border: 1px solid #242424;
    padding: 45px 35px;
    background: #0a0a0a;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    margin-bottom: 35px;
    font-size: 14px;
    line-height: 1.6;
}

label {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #aaa;
    margin-bottom: 9px;
}

input {
    width: 100%;
    background: #111;
    border: 1px solid #292929;
    color: white;
    padding: 15px;
    margin-bottom: 20px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #777;
}

button {
    width: 100%;
    padding: 16px;
    background: white;
    color: black;
    border: none;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    min-height: 25px;
}

.bottom-text {
    text-align: center;
    margin-top: 28px;
    color: #777;
    font-size: 14px;
}

.bottom-text a,
.back {
    color: white;
    text-decoration: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 30px;
    color: #777;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">BRONE</div>

    <div class="login-box">

        <h1>Welcome back.</h1>

        <p class="subtitle">
            Sign in to access your BRONE dashboard.
        </p>

        <form id="login-form">

            <label>EMAIL ADDRESS</label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                required
            >

            <label>PASSWORD</label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                required
            >

            <button id="login-button" type="submit">
                LOGIN
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="bottom-text">
            Don't have an account?
            <a href="signup.html">Create account</a>
        </div>

    </div>

    <a href="index.html" class="back">
        ← Back to BRONE
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://dvcidwppcmgmivolbeev.supabase.co";

const SUPABASE_KEY = "sb_publishable_y-ywXyEcwepxCc5h_uiAFw_sFnJb7L_";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById("login-form");
const message = document.getElementById("message");
const button = document.getElementById("login-button");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.style.color = "white";
    message.textContent = "Logging in...";

    button.disabled = true;
    button.textContent = "LOGGING IN...";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,
                password: password

            });


        if (error) {

            message.style.color = "#ff5555";
            message.textContent = "Error: " + error.message;

            button.disabled = false;
            button.textContent = "LOGIN";

            return;

        }


        message.style.color = "#55ff88";
        message.textContent = "Login successful! Redirecting...";


        setTimeout(function() {

            window.location.href = "dashboard.html";

        }, 1000);


    } catch (error) {

        message.style.color = "#ff5555";

        message.textContent =
            "Something went wrong: " + error.message;

        button.disabled = false;
        button.textContent = "LOGIN";

    }

});

</script>

</body>
</html>
